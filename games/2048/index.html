<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 Fusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a class="brand" href="../../index.html">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-title">Arcadia</span>
      </a>
      <nav class="nav">
        <a href="../../index.html">Início</a>
        <a href="../../games.html">Jogos</a>
        <a class="active" href="../2048/">2048 Fusion</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" data-action="toggle-theme">☀︎</button>
      </div>
    </div>
  </header>

  <main class="container section game-wrap">
    <section class="panel">
      <div class="stats">
        <div class="badge">Pontos: <span id="score">0</span></div>
        <div class="badge">Recorde: <span id="best">0</span></div>
        <div class="badge">Movidas: <span id="moves">0</span></div>
      </div>
      <div class="grid-2048" id="grid"></div>
      <div class="controls" style="margin-top:10px">
        <button class="btn primary" id="btn-start">Novo jogo</button>
        <button class="btn" id="btn-undo">Desfazer</button>
      </div>
    </section>
    <aside class="panel">
      <h3>2048 Fusion</h3>
      <p>Combine os blocos com as setas para alcançar 2048.</p>
    </aside>
  </main>

  <footer class="footer">
    <div class="container">Persista até vencer!</div>
  </footer>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/games/twenty48.js"></script>
</body>
</html>
