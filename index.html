<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcadia | Jogos Modernos</title>
  <meta name="description" content="Jogue Block Break Deluxe, Snake Neo, 2048 Fusion e mais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a class="brand" href="index.html">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-title">Arcadia</span>
      </a>
      <nav class="nav">
        <a class="active" href="index.html">Início</a>
        <a href="games.html">Jogos</a>
        <a href="#destaques">Destaques</a>
        <a href="#novidades">Novidades</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" data-action="toggle-theme" title="Alternar tema">☀︎</button>
        <a class="primary-btn" href="games/block-break-deluxe/">Jogar agora</a>
        <button class="icon-btn" title="Favoritos"><span data-fav-count>0</span>★</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-wrap">
        <div>
          <h1>Descubra e jogue jogos web modernos</h1>
          <p>Arcade, puzzle e clássicos reimaginados. Tudo direto no navegador, sem instalação.</p>
          <div class="actions">
            <button class="primary-btn" data-action="play-featured">Jogar Block Break Deluxe</button>
            <a class="btn" href="/games.html">Explorar todos os jogos</a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="sparkle"></div>
        </div>
      </div>
    </section>

    <section id="destaques" class="section">
      <div class="section-header">
        <h2 class="section-title">Destaques</h2>
      </div>
      <div id="destaques-grid" class="grid"></div>
    </section>

    <section id="novidades" class="section">
      <div class="section-header">
        <h2 class="section-title">Novidades</h2>
      </div>
      <div id="novidades-grid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div>Feito com ❤ • Arcadia — Jogos Web</div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
